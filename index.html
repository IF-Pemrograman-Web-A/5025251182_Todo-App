<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Study Planner</h1>
        <p>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</p>

        <button type="button" id="darkModeButton">
            Dark Mode
        </button>
    </header>

    <main>
        <section class="task-list" aria-labelledby="taskListTitle">
            <h2 id="taskListTitle">My Tasks</h2>
            <div id="taskContainer" aria-live="polite">
            </div>
        </section>

        <aside class="task-detail" aria-labelledby="detailTitle">
            <h2 id="detailTitle">Task Detail</h2>
            <label for="detailName">Task Name</label>
            <input
                type="text"
                id="detailName"
                readonly
            >
            <label for="detailDescription">Description</label>
            <textarea
                id="detailDescription"
                rows="5"
                readonly
            ></textarea>
            <label for="detailDeadline">Deadline</label>
            <input
                type="date"
                id="detailDeadline"
                readonly
            >
        </aside>
    </main>

    <section class="new-task" aria-labelledby="newTaskTitle">
        <h2 id="newTaskTitle">Create New Task</h2>

        <form id="taskForm">
            <label for="taskName">
                Task Name
            </label>
            <input
                type="text"
                id="taskName"
                placeholder="Enter your task"
                required
            >

            <label for="taskDescription">
                Description
            </label>
            <textarea
                id="taskDescription"
                rows="4"
                placeholder="Enter task description"
                required
            ></textarea>

            <label for="taskDeadline">
                Deadline
            </label>
            <input
                type="date"
                id="taskDeadline"
            >

            <label for="taskImage">
                Task Image
            </label>
            <input
                type="file"
                id="taskImage"
                accept="image/*"
                capture="environment"
            >

            <label for="notificationTime">
                Notification Time
            </label>
            <input
                type="datetime-local"
                id="notificationTime"
            >

            <button type="submit">
                Add Task
            </button>
        </form>
    </section>

    <footer>
        <p>2026 Study Planner</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
