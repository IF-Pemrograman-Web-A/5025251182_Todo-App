<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Study Planner</h1>
        <p>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</p>

        <button id="darkModeButton">Dark Mode</button>
    </header>

    <main>

        <section class="task-list">
            <h2>My Tasks</h2>

            <div class="task">
                <input type="checkbox">

                <div>
                    <h3>Tugas Teori Graf</h3>
                    <p>Tugas Mingguan 1 dan 2</p>
                </div>

                <button class="edit-button">Edit</button>
                <button class="delete-button">Delete</button>
            </div>

            <div class="task">
                <input type="checkbox">

                <div>
                    <h3>Tugas KPPL</h3>
                    <p>Resume IBM</p>
                </div>

                <button class="edit-button">Edit</button>
                <button class="delete-button">Delete</button>
            </div>

            <div class="task">
                <input type="checkbox">

                <div>
                    <h3>Schematics</h3>
                    <p>Crosscheck kontak sekolah</p>
                </div>

                <button class="edit-button">Edit</button>
                <button class="delete-button">Delete</button>
            </div>

            <div class="task">
                <input type="checkbox">

                <div>
                    <h3>Tugas Matematika Diskrit</h3>
                    <p>Predicate and Quantifier</p>
                </div>

                <button class="edit-button">Edit</button>
                <button class="delete-button">Delete</button>
            </div>

        </section>

        <aside class="task-detail">
            <h2>Task Detail</h2>

            <label>Task Name</label>
            <input type="text" value="Tugas Teori Graf">

            <label>Description</label>
            <textarea rows="5">Tugas Mingguan 1 dan 2</textarea>

            <label>Deadline</label>
            <input type="date">

            <button>Save Task</button>
        </aside>

    </main>

    <section class="new-task">
        <h2>Create New Task</h2>

        <form id="taskForm">

            <label>Task Name</label>
            <input type="text" id="taskName" placeholder="Enter your task" required>

            <label>Description</label>
            <textarea id="taskDescription" rows="4" placeholder="Enter task description" required></textarea>

            <label>Deadline</label>
            <input type="date" id="taskDeadline">

            <button type="submit">Add Task</button>

        </form>
    </section>

    <footer>
        <p>2026 Study Planner</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
